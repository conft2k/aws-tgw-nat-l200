site_name: AWS Transit Gateway 1:1 NAT 워크숍
site_description: Direct Connect와 AWS Transit Gateway 1:1 NAT로 겹치는 온프레미스 대역을 연결하는 실습(L200)
site_url: https://ws.nettfc.net/aws-tgw-nat-l200/
repo_url: https://github.com/conft2k/aws-tgw-nat-l200
repo_name: aws-tgw-nat-l200
edit_uri: ""
copyright: MIT License

theme:
  name: material
  language: ko
  # fonts come from extra_css (Pretendard is not on Google Fonts)
  font: false
  logo: assets/icons/transit-gateway.svg
  favicon: assets/icons/transit-gateway.svg
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 어두운 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 밝은 모드

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  *.draft.svg

validation:
  anchors: warn

hooks:
  - hooks/cachebust.py

extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap
  - assets/extra.css

nav:
  - "1. 시작하기 전에":
      - "1-1. 소개": index.md
      - "1-2. 사전 준비": prerequisites.md
      - "1-3. 용어 풀이": glossary.md
  - "2. 실습":
      - "2-1. 시작하기": lab0.md
      - "2-2. Direct Connect 연결": lab1.md
      - "2-3. 1:1 NAT 적용": lab2.md
  - "3. 추가 과제":
      - "3-1. NAT 없는 VPC와 원래 경로": extra-a.md
      - "3-2. 경로 설치 옵션": extra-b.md
      - "3-3. 지표와 Flow Logs": extra-c.md
      - "3-4. 리소스 정리": extra-d.md
  - "4. 부록":
      - "4-1. 라우터 설정 생성기": router-config.md
      - "4-2. 1:1 NAT 개념과 제약": concepts.md
      - "4-3. 사전 테스트에서 관찰한 동작": observed.md
      - "4-4. 문제 해결": troubleshooting.md
      - "4-5. 참고 문서": references.md
