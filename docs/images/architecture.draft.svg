<svg viewBox="0 0 1728 676" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK KR', 'Pretendard', Arial, sans-serif">
  <!-- Workshop: Transit Gateway 1:1 NAT over Direct Connect (participant pod N), Korean labels.
       Main line y=346: router -> Direct Connect (two transit VIFs) -> DX gateway -> TGW.
       VPC-A above the TGW, VPC-B below it; attachments are plain lines (topology, no arrowheads).
       The TGW route table is drawn as a table with a thin leader line to the TGW.
       Tags: dark = the participant creates it in the console; pink = the CloudFormation stack deploys it. -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#232F3E"/>
    </marker>
  </defs>
  <rect width="1728" height="676" fill="#FFFFFF"/>

