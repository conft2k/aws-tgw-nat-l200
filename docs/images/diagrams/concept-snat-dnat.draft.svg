  <text x="632" y="140" font-size="16" fill="#232F3E">Source CIDR</text>
  <text x="743" y="140" font-size="16" fill="#232F3E">172.20.N.0/24</text>
  <text x="632" y="162" font-size="16" fill="#232F3E">NAT CIDR</text>
  <text x="743" y="162" font-size="16" font-weight="600" fill="#C7511F">100.64.1.0/24</text>
  <rect x="888" y="92" width="249" height="82" fill="#FFFFFF" stroke="#7D8998" stroke-width="1" rx="4"/>
  <text x="900" y="116" font-size="16" font-weight="600" fill="#232F3E">VPC-A 연결의 1:1 NAT 규칙</text>
  <text x="900" y="140" font-size="16" fill="#232F3E">Source CIDR</text>
  <text x="1011" y="140" font-size="16" fill="#232F3E">172.20.N.0/24</text>
  <text x="900" y="162" font-size="16" fill="#232F3E">NAT CIDR</text>
  <text x="1011" y="162" font-size="16" font-weight="600" fill="#C7511F">100.64.2.0/24</text>
