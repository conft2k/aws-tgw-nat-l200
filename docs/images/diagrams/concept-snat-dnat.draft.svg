  <text x="387" y="332" font-size="18.5" text-anchor="middle" fill="#232F3E">AWS Direct</text>
  <text x="387" y="354" font-size="18.5" text-anchor="middle" fill="#232F3E">Connect</text>
  <image href="bundle:resource/AWS-Direct-Connect_Gateway" x="503" y="258" width="52" height="52"/>
  <text x="529" y="332" font-size="18.5" text-anchor="middle" fill="#232F3E">Direct Connect</text>
