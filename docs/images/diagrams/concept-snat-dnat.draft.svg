  <image href="bundle:service/Amazon-Virtual-Private-Cloud" x="1018" y="369" width="52" height="52"/>
  <text x="1044" y="443" font-size="18.5" text-anchor="middle" fill="#232F3E">VPC-B</text>
  <text x="1044" y="465" font-size="16" text-anchor="middle" fill="#232F3E">10.1.1.0/24</text>
  <text x="1044" y="486" font-size="16" font-weight="600" text-anchor="middle" fill="#232F3E">VPC-B 연결: 규칙 없음</text>
  <text x="1044" y="507" font-size="16" text-anchor="middle" fill="#232F3E">→ 아무것도 바꾸지 않음</text>
