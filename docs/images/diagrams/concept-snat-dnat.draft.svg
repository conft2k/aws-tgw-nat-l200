<svg viewBox="0 0 1445 441" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK KR', 'Pretendard', Arial, sans-serif">
  <!-- Concept: where TGW 1:1 NAT rewrites addresses (per attachment, both directions). -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#232F3E"/></marker></defs>
  <rect width="1445" height="441" fill="#FFFFFF"/>
  <rect x="16" y="140" width="268" height="164" fill="none" stroke="#7D8998" stroke-width="2"/>
  <image href="bundle:group/Corporate-data-center_32" x="16" y="140" width="24" height="24"/>
  <text x="48" y="158" font-size="14" font-weight="600" fill="#7D8998">온프레미스 (내 Pod N)</text>
  <text x="48" y="174" font-size="13" fill="#232F3E">온프레미스 대역 172.20.N.0/24</text>
  <rect x="464" y="16" width="965" height="349" fill="none" stroke="#232F3E" stroke-width="2"/>
  <image href="bundle:group/AWS-Cloud-logo_32" x="464" y="16" width="32" height="32"/>
  <text x="506" y="38" font-size="15" font-weight="600" fill="#232F3E">AWS Cloud</text>
  <rect x="664" y="50" width="745" height="299" fill="none" stroke="#00A4A6" stroke-width="2" stroke-dasharray="3,3"/>
  <image href="bundle:group/Region_32" x="664" y="50" width="24" height="24"/>
  <text x="696" y="68" font-size="14" font-weight="600" fill="#00A4A6">아시아 태평양(서울) ap-northeast-2</text>
  <image href="bundle:resource/Server" x="52" y="194" width="48" height="48"/>
  <text x="76" y="260" font-size="14" text-anchor="middle" fill="#232F3E">온프레미스 VM</text>
  <text x="76" y="276" font-size="14" text-anchor="middle" fill="#232F3E">vmN</text>
  <text x="76" y="292" font-size="13" text-anchor="middle" fill="#545B64">172.20.N.10</text>
  <image href="bundle:resource/Amazon-VPC_Customer-Gateway" x="192" y="194" width="48" height="48"/>
  <text x="216" y="260" font-size="14" text-anchor="middle" fill="#232F3E">온프레미스 라우터</text>
  <text x="216" y="276" font-size="14" text-anchor="middle" fill="#232F3E">rtN</text>
  <image href="bundle:service/AWS-Direct-Connect" x="350" y="194" width="48" height="48"/>
  <text x="374" y="260" font-size="14" text-anchor="middle" fill="#232F3E">AWS Direct Connect</text>
  <image href="bundle:resource/AWS-Direct-Connect_Gateway" x="536" y="194" width="48" height="48"/>
  <text x="560" y="260" font-size="14" text-anchor="middle" fill="#232F3E">Direct Connect gateway</text>
  <image href="bundle:service/AWS-Transit-Gateway" x="1030" y="194" width="48" height="48"/>
  <text x="1054" y="260" font-size="14" text-anchor="middle" fill="#232F3E">Transit Gateway</text>
  <image href="bundle:service/Amazon-Virtual-Private-Cloud" x="1322" y="140" width="48" height="48"/>
  <text x="1346" y="206" font-size="14" text-anchor="middle" fill="#232F3E">VPC-A</text>
  <text x="1346" y="222" font-size="13" text-anchor="middle" fill="#545B64">172.20.N.0/24</text>
  <image href="bundle:service/Amazon-Virtual-Private-Cloud" x="1322" y="248" width="48" height="48"/>
  <text x="1346" y="314" font-size="14" text-anchor="middle" fill="#232F3E">VPC-B</text>
  <text x="1346" y="330" font-size="13" text-anchor="middle" fill="#545B64">10.1.1.0/24</text>
  <line x1="104" y1="218" x2="188" y2="218" stroke="#232F3E" stroke-width="1.5"/>
  <line x1="244" y1="218" x2="346" y2="218" stroke="#232F3E" stroke-width="1.5"/>
  <line x1="402" y1="218" x2="532" y2="218" stroke="#232F3E" stroke-width="1.5"/>
  <line x1="588" y1="208" x2="1022" y2="208" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1026" y1="228" x2="592" y2="228" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="832" y="170" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">TGW로 들어올 때: 출발지 주소 바꾸기(SNAT)</text>
  <text x="832" y="186" font-size="13" text-anchor="middle" fill="#232F3E">Source CIDR 안의 출발지 → NAT 대역</text>
  <text x="832" y="202" font-size="13" text-anchor="middle" fill="#545B64">목적지와 관계없이</text>
  <text x="832" y="246" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">TGW에서 나갈 때: 목적지 주소 되돌리기(DNAT)</text>
  <text x="832" y="262" font-size="13" text-anchor="middle" fill="#232F3E">NAT 대역 안의 목적지 → 원래 대역</text>
  <rect x="722" y="80" width="220" height="70" fill="#FFFFFF" stroke="#7D8998" stroke-width="1" rx="4"/>
  <text x="734" y="100" font-size="13" font-weight="600" fill="#232F3E">DXGW 연결의 1:1 NAT 규칙</text>
  <text x="734" y="119" font-size="13" fill="#545B64">Source CIDR</text>
  <text x="829" y="119" font-size="13" fill="#232F3E">172.20.N.0/24</text>
  <text x="734" y="137" font-size="13" fill="#545B64">NAT CIDR</text>
  <text x="829" y="137" font-size="13" font-weight="600" fill="#C7511F">100.64.1.0/24</text>
  <polyline points="1082,210 1120,210 1120,164 1318,164" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <rect x="1094" y="80" width="220" height="70" fill="#FFFFFF" stroke="#7D8998" stroke-width="1" rx="4"/>
  <text x="1106" y="100" font-size="13" font-weight="600" fill="#232F3E">VPC-A 연결의 1:1 NAT 규칙</text>
  <text x="1106" y="119" font-size="13" fill="#545B64">Source CIDR</text>
  <text x="1201" y="119" font-size="13" fill="#232F3E">172.20.N.0/24</text>
  <text x="1106" y="137" font-size="13" fill="#545B64">NAT CIDR</text>
  <text x="1201" y="137" font-size="13" font-weight="600" fill="#C7511F">100.64.2.0/24</text>
  <polyline points="1082,226 1120,226 1120,272 1318,272" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <text x="1219" y="264" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">VPC-B 연결: 규칙 없음</text>
  <text x="1219" y="292" font-size="13" text-anchor="middle" fill="#545B64">→ 아무것도 바꾸지 않음</text>
  <rect x="16" y="381" width="1413" height="44" fill="#F8F9F9" stroke="#D5DBDB" stroke-width="1"/>
  <text x="28" y="407.5" font-size="13" font-weight="600" fill="#232F3E">상태 없음(stateless) · 1:1</text>
  <text x="232.7" y="407.5" font-size="13" fill="#545B64">호스트 비트와 포트는 그대로 (172.20.N.10 ↔ 100.64.1.10, 172.20.N.10 ↔ 100.64.2.10)</text>
</svg>
