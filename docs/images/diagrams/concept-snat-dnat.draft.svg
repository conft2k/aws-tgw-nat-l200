  <line x1="768" y1="293" x2="563" y2="293" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="828" y1="284" x2="1014" y2="284" stroke="#232F3E" stroke-width="1.5"/>
  <polyline points="828,298 982,298 982,395 1014,395" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <text x="798" y="202" font-size="16" font-weight="600" text-anchor="middle" fill="#232F3E">TGW로 들어올 때: 출발지 주소 바꾸기(SNAT)</text>
  <text x="798" y="223" font-size="16" text-anchor="middle" fill="#232F3E">Source CIDR 안의 출발지 → NAT 대역</text>
  <text x="798" y="244" font-size="16" text-anchor="middle" fill="#232F3E">목적지와 관계없이</text>
  <text x="798" y="358" font-size="16" font-weight="600" text-anchor="middle" fill="#232F3E">TGW에서 나갈 때: 목적지 주소 되돌리기(DNAT)</text>
  <text x="798" y="379" font-size="16" text-anchor="middle" fill="#232F3E">NAT 대역 안의 목적지 → 원래 대역</text>
  <rect x="620" y="92" width="249" height="82" fill="#FFFFFF" stroke="#7D8998" stroke-width="1" rx="4"/>
