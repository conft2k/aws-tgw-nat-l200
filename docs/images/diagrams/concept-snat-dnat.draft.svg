  <image href="bundle:resource/Server" x="58" y="258" width="52" height="52"/>
  <text x="84" y="332" font-size="18.5" text-anchor="middle" fill="#232F3E">온프레미스 VM</text>
  <text x="84" y="354" font-size="18.5" text-anchor="middle" fill="#232F3E">vmN</text>
  <text x="84" y="376" font-size="16" text-anchor="middle" fill="#232F3E">172.20.N.10</text>
