<svg viewBox="0 0 1282 675" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK KR', 'Pretendard', Arial, sans-serif">
  <!-- Lab 1: how the Direct Connect side is built (pod N). Badges = creation order 1-5. -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#232F3E"/></marker></defs>
  <rect width="1282" height="675" fill="#FFFFFF"/>
  <rect x="16" y="16" width="388" height="436" fill="none" stroke="#7D8998" stroke-width="2"/>
  <image href="bundle:group/Corporate-data-center_32" x="16" y="16" width="24" height="24"/>
  <text x="48" y="34" font-size="14" font-weight="600" fill="#7D8998">온프레미스 (내 Pod N)</text>
  <text x="48" y="50" font-size="13" fill="#232F3E">온프레미스 대역 172.20.N.0/24</text>
  <rect x="664" y="16" width="602" height="436" fill="none" stroke="#232F3E" stroke-width="2"/>
  <image href="bundle:group/AWS-Cloud-logo_32" x="664" y="16" width="32" height="32"/>
  <text x="706" y="38" font-size="15" font-weight="600" fill="#232F3E">AWS Cloud</text>
  <rect x="900" y="155" width="346" height="133" fill="none" stroke="#00A4A6" stroke-width="2" stroke-dasharray="3,3"/>
  <image href="bundle:group/Region_32" x="900" y="155" width="24" height="24"/>
  <text x="932" y="173" font-size="14" font-weight="600" fill="#00A4A6">아시아 태평양(서울) ap-northeast-2</text>
  <image href="bundle:resource/Amazon-VPC_Customer-Gateway" x="86" y="191" width="48" height="48"/>
  <text x="110" y="257" font-size="14" text-anchor="middle" fill="#232F3E">온프레미스 라우터</text>
  <text x="110" y="273" font-size="14" text-anchor="middle" fill="#232F3E">rtN · AS 65000</text>
  <text x="110" y="289" font-size="13" text-anchor="middle" fill="#545B64">Loopback1 10.200.0.1/32</text>
  <circle cx="96" cy="175" r="10" fill="#232F3E"/>
  <text x="96" y="179.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <polyline points="138,207 200,207 200,140 508,140" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <polyline points="138,223 200,223 200,290 508,290" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <text x="302" y="132" font-size="13" text-anchor="middle" fill="#232F3E">GigabitEthernet1.&lt;VLAN1&gt;</text>
  <text x="302" y="282" font-size="13" text-anchor="middle" fill="#232F3E">GigabitEthernet2.&lt;VLAN2&gt;</text>
  <image href="bundle:service/AWS-Direct-Connect" x="512" y="116" width="48" height="48"/>
  <text x="536" y="182" font-size="14" text-anchor="middle" fill="#232F3E">hosted connection 1</text>
  <text x="536" y="198" font-size="13" text-anchor="middle" fill="#545B64">50 Mbps · VLAN &lt;VLAN1&gt;</text>
  <text x="536" y="214" font-size="13" text-anchor="middle" fill="#545B64">전송 가상 인터페이스 1</text>
  <text x="536" y="230" font-size="13" text-anchor="middle" fill="#545B64">BGP + BFD · 169.254.x.x/29</text>
  <circle cx="522" cy="100" r="10" fill="#232F3E"/>
  <text x="522" y="104.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="616" cy="126" r="10" fill="#232F3E"/>
  <text x="616" y="130.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <image href="bundle:service/AWS-Direct-Connect" x="512" y="266" width="48" height="48"/>
  <text x="536" y="332" font-size="14" text-anchor="middle" fill="#232F3E">hosted connection 2</text>
  <text x="536" y="348" font-size="13" text-anchor="middle" fill="#545B64">50 Mbps · VLAN &lt;VLAN2&gt;</text>
  <text x="536" y="364" font-size="13" text-anchor="middle" fill="#545B64">전송 가상 인터페이스 2</text>
  <text x="536" y="380" font-size="13" text-anchor="middle" fill="#545B64">BGP + BFD · 169.254.x.x/29</text>
  <circle cx="522" cy="250" r="10" fill="#232F3E"/>
  <text x="522" y="254.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="616" cy="276" r="10" fill="#232F3E"/>
  <text x="616" y="280.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <polyline points="564,140 700,140 700,207 772,207" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <polyline points="564,290 700,290 700,223 772,223" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <image href="bundle:resource/AWS-Direct-Connect_Gateway" x="776" y="191" width="48" height="48"/>
  <text x="800" y="257" font-size="14" text-anchor="middle" fill="#232F3E">Direct Connect gateway</text>
  <text x="800" y="273" font-size="13" text-anchor="middle" fill="#545B64">AS 65300</text>
  <circle cx="786" cy="175" r="10" fill="#232F3E"/>
  <text x="786" y="179.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <line x1="828" y1="215" x2="1144" y2="215" stroke="#232F3E" stroke-width="1.5"/>
  <circle cx="1004" cy="201" r="10" fill="#232F3E"/>
  <text x="1004" y="205.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="1004" y="233" font-size="13" text-anchor="middle" fill="#232F3E">게이트웨이 연결</text>
  <text x="1004" y="249" font-size="13" text-anchor="middle" fill="#545B64">허용된 접두사:</text>
  <text x="1004" y="265" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">100.64.2.0/24, 10.1.1.0/24</text>
  <image href="bundle:service/AWS-Transit-Gateway" x="1148" y="191" width="48" height="48"/>
  <text x="1172" y="257" font-size="14" text-anchor="middle" fill="#232F3E">Transit Gateway</text>
  <text x="1172" y="273" font-size="13" text-anchor="middle" fill="#545B64">AS 65400</text>
  <polyline points="120,187 120,84 810,84 810,187" fill="none" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="534" y="58" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">BGP 광고 (온프레미스 라우터 → AWS)</text>
  <text x="534" y="74" font-size="13" text-anchor="middle" fill="#232F3E">172.20.N.0/24 · 10.200.0.1/32</text>
  <polyline points="800,282 800,390 110,390 110,297" fill="none" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="534" y="408" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">온프레미스 라우터가 받는 경로</text>
  <text x="534" y="424" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">= 허용된 접두사</text>
  <text x="534" y="440" font-size="13" text-anchor="middle" fill="#232F3E">100.64.2.0/24 · 10.1.1.0/24</text>
  <text x="534" y="456" font-size="13" text-anchor="middle" fill="#545B64">두 VIF 모두 같은 경로 (ECMP)</text>
  <rect x="16" y="468" width="1250" height="191" fill="#F8F9F9" stroke="#D5DBDB" stroke-width="1"/>
  <circle cx="38" cy="490" r="10" fill="#232F3E"/>
  <text x="38" y="494.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="56" y="494.5" font-size="13" font-weight="600" fill="#232F3E">hosted connection 수락</text>
  <text x="301.55" y="494.5" font-size="13" fill="#545B64">파트너가 VLAN을 정해 만든 50 Mbps hosted connection 2개를 Direct Connect 콘솔에서 각각 수락합니다.</text>
  <circle cx="38" cy="514" r="10" fill="#232F3E"/>
  <text x="38" y="518.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="56" y="518.5" font-size="13" font-weight="600" fill="#232F3E">Direct Connect gateway 만들기</text>
  <text x="301.55" y="518.5" font-size="13" fill="#545B64">Amazon 측 ASN은 65300입니다. 특정 리전에 속하지 않는 글로벌 리소스입니다.</text>
  <circle cx="38" cy="538" r="10" fill="#232F3E"/>
  <text x="38" y="542.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="56" y="542.5" font-size="13" font-weight="600" fill="#232F3E">Transit Gateway와 게이트웨이 연결</text>
  <text x="301.55" y="542.5" font-size="13" fill="#545B64">Transit Gateway(AS 65400)에 DXGW Transit Gateway 연결(attachment)이 생깁니다.</text>
  <text x="301.55" y="559.5" font-size="13" fill="#545B64">허용된 접두사 100.64.2.0/24, 10.1.1.0/24가 그대로 온프레미스 라우터에 광고됩니다.</text>
  <circle cx="38" cy="579" r="10" fill="#232F3E"/>
  <text x="38" y="583.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="56" y="583.5" font-size="13" font-weight="600" fill="#232F3E">전송 가상 인터페이스 만들기</text>
  <text x="301.55" y="583.5" font-size="13" fill="#545B64">hosted connection마다 하나씩, 그 VLAN으로 만들고 Direct Connect gateway에 붙입니다.</text>
  <text x="301.55" y="600.5" font-size="13" fill="#545B64">BGP + BFD를 쓰고, 피어 IP(169.254.x.x/29)와 BGP 인증 키는 AWS가 만듭니다.</text>
  <circle cx="38" cy="620" r="10" fill="#232F3E"/>
  <text x="38" y="624.5" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="56" y="624.5" font-size="13" font-weight="600" fill="#232F3E">온프레미스 라우터 BGP 설정</text>
  <text x="301.55" y="624.5" font-size="13" fill="#545B64">GigabitEthernet1.&lt;VLAN1&gt;, GigabitEthernet2.&lt;VLAN2&gt;에서 AS 65300과 피어링하고 172.20.N.0/24,</text>
  <text x="301.55" y="641.5" font-size="13" fill="#545B64">10.200.0.1/32를 광고합니다. 두 VIF가 같은 경로를 받아 ECMP로 나눠 씁니다.</text>
</svg>
